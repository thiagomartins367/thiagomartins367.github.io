<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48 32x32 16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <meta
      name="description"
      content="Portfólio - Thiago Martins"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- A foto de perfil começa a ser baixada junto com o JavaScript, e não depois dele -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="%PUBLIC_URL%/assets/thiago-martins.webp"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600&display=swap"
      rel="stylesheet"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Thiago Martins</title>
    <!--
      Estilos da tela de carregamento ficam inline para que ela apareça antes do
      CSS da aplicação. Ela é escondida por src/loadingScreen.js.
    -->
    <style>
      .is-loading {
        overflow: hidden;
      }

      #loading-screen {
        align-items: center;
        animation: loading-screen-failsafe 0s 10s forwards;
        background-color: #121212;
        bottom: 0;
        display: flex;
        justify-content: center;
        left: 0;
        position: fixed;
        right: 0;
        top: 0;
        transition: opacity 0.3s ease, visibility 0.3s;
        z-index: 1000;
      }

      #loading-screen.loading-screen-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loading-screen-spinner {
        animation: loading-screen-spin 0.8s linear infinite;
        border: 3px solid #3a3a3a;
        border-radius: 50%;
        border-top-color: #ffdb70;
        height: 40px;
        width: 40px;
      }

      .loading-screen-text {
        clip: rect(0 0 0 0);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      @keyframes loading-screen-spin {

        to {
          transform: rotate(360deg);
        }
      }

      /* Garante que a tela some mesmo se o JavaScript da aplicação falhar ao carregar */
      @keyframes loading-screen-failsafe {

        to {
          visibility: hidden;
        }
      }

      @media ( prefers-reduced-motion : reduce ) {

        #loading-screen {
          transition: none;
        }
      }
    </style>
    <noscript>
      <style>
        #loading-screen {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="loading-screen" role="status">
      <div class="loading-screen-spinner"></div>
      <span class="loading-screen-text">Carregando...</span>
    </div>
    <script>
      document.documentElement.classList.add('is-loading');
      window.loadingScreenShownAt = performance.now();
    </script>
    <main id="root"></main>
  </body>
</html>
