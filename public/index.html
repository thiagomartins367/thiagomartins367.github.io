    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Thiago Martins — Desenvolvedor Full-Stack .NET (C#, ASP.NET Core, React)</title>
    <!--
      Dados estruturados (schema.org) para buscadores e IAs: o conteúdo do site é
      renderizado pelo React, então sem isso o HTML não diz quem é a pessoa nem o
      que ela faz. Ao mudar cargo, empresa ou skills no data.json, atualize aqui
      e no public/llms.txt.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://thiagodmartins.dev/#website",
            "url": "https://thiagodmartins.dev",
            "name": "Thiago Martins",
            "inLanguage": "pt-BR",
            "publisher": { "@id": "https://thiagodmartins.dev/#person" }
          },
          {
            "@type": "ProfilePage",
            "@id": "https://thiagodmartins.dev/#profilepage",
            "url": "https://thiagodmartins.dev",
            "name": "Thiago Martins — Desenvolvedor Full-Stack .NET (C#, ASP.NET Core, React)",
            "inLanguage": "pt-BR",
            "isPartOf": { "@id": "https://thiagodmartins.dev/#website" },
            "mainEntity": { "@id": "https://thiagodmartins.dev/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://thiagodmartins.dev/#person",
            "name": "Thiago Martins",
            "url": "https://thiagodmartins.dev",
            "image": "https://thiagodmartins.dev/assets/thiago-martins.webp",
            "jobTitle": "Desenvolvedor Full-Stack .NET",
            "description": "Desenvolvedor Full-Stack Pleno com foco em back-end .NET: APIs REST em C# e ASP.NET Core, modelagem de dados e regras de negócio, apoiando o front-end com React e TypeScript.",
            "email": "mailto:contato@thiagodmartins.dev",
            "worksFor": {
              "@type": "Organization",
              "name": "Avoque Consultores",
              "url": "https://avoque.com.br"
            },
            "alumniOf": [
              {
                "@type": "EducationalOrganization",
                "name": "Instituto Federal do Espírito Santo (Ifes)",
                "url": "https://cachoeiro.ifes.edu.br"
              },
              {
                "@type": "EducationalOrganization",
                "name": "Trybe",
                "url": "https://www.betrybe.com"
              }
            ],
            "knowsAbout": [
              "C#", ".NET", "ASP.NET Core", "LINQ", "Entity Framework", "APIs REST",
              "POO", "SOLID", "Node.js", "Express", "React", "TypeScript",
              "JavaScript", "Redux", "Tailwind CSS", "Styled-Components",
              "SQL Server", "MySQL", "MongoDB", "Redis", "Docker", "Azure", "AWS",
              "GitHub Actions", "CI/CD", "xUnit", "Jest", "Scrum", "Kanban"
            ],
            "knowsLanguage": "pt-BR",
            "sameAs": [
              "https://www.linkedin.com/in/thiago-dioria-martins",
              "https://github.com/thiagomartins367"
            ]
          }
        ]
      }
    </script>
    <!--
      Estilos da tela de carregamento ficam inline para que ela apareça antes do
      CSS da aplicação. Ela é escondida por src/loadingScreen.js.
    -->
    <style>
      .is-loading {
        overflow: hidden;
      }

      #loading-screen {
        align-items: center;
        animation: loading-screen-failsafe 0s 10s forwards;
        background-color: #121212;
        bottom: 0;
        display: flex;
        justify-content: center;
        left: 0;
        position: fixed;
        right: 0;
        top: 0;
        transition: opacity 0.3s ease, visibility 0.3s;
        z-index: 1000;
      }

      #loading-screen.loading-screen-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loading-screen-spinner {
        animation: loading-screen-spin 0.8s linear infinite;
        border: 3px solid #3a3a3a;
        border-radius: 50%;
        border-top-color: #ffdb70;
        height: 40px;
        width: 40px;
      }

      .loading-screen-text {
        clip: rect(0 0 0 0);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      @keyframes loading-screen-spin {

        to {
          transform: rotate(360deg);
        }
      }

      /* Garante que a tela some mesmo se o JavaScript da aplicação falhar ao carregar */
      @keyframes loading-screen-failsafe {

        to {
          visibility: hidden;
        }
      }

      @media ( prefers-reduced-motion : reduce ) {

        #loading-screen {
          transition: none;
        }
      }
    </style>
    <noscript>
      <style>
        #loading-screen {
          display: none;
        }
      </style>
    </noscript>
    <!--
      Vercel Web Analytics: conta visitantes e visualizações de página, sem cookies.
      O script é servido pela própria Vercel no deploy, por isso só é carregado no
      build de produção (o CRA troca %NODE_ENV% pelo ambiente do build).
    -->
    <script>
      if ('%NODE_ENV%' === 'production') {
        window.va = window.va || function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
        var vercelAnalyticsScript = document.createElement('script');
        vercelAnalyticsScript.defer = true;
        vercelAnalyticsScript.src = '/_vercel/insights/script.js';
        document.head.appendChild(vercelAnalyticsScript);
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="loading-screen" role="status">
      <div class="loading-screen-spinner"></div>
      <span class="loading-screen-text">Carregando...</span>
    </div>
    <script>
      document.documentElement.classList.add('is-loading');
      window.loadingScreenShownAt = performance.now();
    </script>
    <main id="root"></main>
  </body>
</html>
