version: "3.8"
services:
  my-portfolio:
    container_name: my-portfolio
    image: my-portfolio
    build: 
      context: .
      dockerfile: Dockerfile.prod
    working_dir: /usr/share/nginx/html
    restart: always
    env_file:
      - ./.env.production.local
    ports:
      - 3080:80
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      - my-portfolio-network

networks:
  my-portfolio-network:
    external: false
    name: my-portfolio-network
