version: "3.8"
services:
  dev-my-portfolio:
    container_name: dev-my-portfolio
    image: dev-my-portfolio
    build: 
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /usr/src/dev-my-portfolio
    restart: always
    env_file:
      - ./.env.development.local
    ports:
      - 3070:3070
    volumes:
      - ./src:/usr/src/dev-my-portfolio/src # Mapeamento apenas para ambiente DEV
      - ./public:/usr/src/dev-my-portfolio/public # Mapeamento apenas para ambiente DEV
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      - dev-my-portfolio-network

networks:
  dev-my-portfolio-network:
    external: false
    name: dev-my-portfolio-network
